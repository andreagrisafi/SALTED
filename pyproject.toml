[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "salted"
version = "3.0.3"
description = "Symmetry-Adapted Learning of Three-Dimensional Electron Densities"
readme = "README.rst"
requires-python = ">=3.10"
license = { text = "GNU General Public License v3 or later (GPLv3+)" }
authors = [
    { name = "Andrea Grisafi", email = "andrea.grisafi@sorbonne-universite.fr" },
    { name = "Alan Lewis", email = "alan.m.lewis@york.ac.uk" },
    { name = "Mariana Rossi", email = "mr2102@cam.ac.uk" },
    { name = "Zekun Lou", email = "zekun.lou@mpsd.mpg.de" },
]
dependencies = [
    "mpi4py",
    "featomic>=0.6",
    "ase",
    "numpy",
    "numba",
    "scipy",
    "h5py",
    "sympy",
    "pyscf",
    "pyyaml",
    "packaging",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
docs = [
    "mkdocs",
    "mkdocstrings[python]",
    "markdown-include",
    "pymdown-extensions",
]
test = [
    "pytest",
]
all = ["salted[docs,test]"]

[project.urls]
Homepage = "https://github.com/andreagrisafi/SALTED"

[tool.setuptools.packages.find]
include = ["salted*"]
exclude = ["salted.ortho*", "*_deprecated_*"]

[tool.setuptools.package-data]
# In case one needs the FORTRAN code again
salted = ["lib/*.so"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end test of a model's pipeline, needs the SALTED-datasets repository",
    "aims_density: tests of the water_monomer_AIMS dataset (serial + MPI equivalence)",
    "pyscf_density: tests of the water_monomer_PySCF dataset (serial)",
    "cp2k_density: tests of the water_monomer_CP2K dataset (serial)",
    "aims_response: density-response tests of the water_monomer_AIMS_response_subset100 dataset (serial + MPI)",
]
