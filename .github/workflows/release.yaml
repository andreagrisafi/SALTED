name: Release to PyPI

# Publishing a GitHub release (tag vX.Y.Z) uploads salted-gpr X.Y.Z to PyPI.
# SALTED is pure Python, so one py3-none-any wheel serves every supported Python version.
# Auth is PyPI Trusted Publishing: no token is stored; PyPI trusts this workflow file
# (configured once on pypi.org: project salted-gpr, workflow release.yaml, environment pypi).

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # for Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check tag matches pyproject version
        run: |
          v=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$v" || { echo "tag $GITHUB_REF_NAME != pyproject version $v"; exit 1; }

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
