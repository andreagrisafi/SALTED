# workflow label and root directory
salted:
  saltedname: test
  saltedpath: ./

# system general parameters
system:
  filename: ./methylene_200.xyz
  species: [H, C]
  collinear: True

# quantum mechanical info
qm:
  path2qm: ./
  qmcode: aims
  dfbasis: FHI-aims-clusters

# prediction data
prediction:
  filename: ./rattled_methylene.xyz
  predname: prediction
  predict_data: ./aims_pred_data

# atomic environment parameters (for rascaline)
descriptor:
  rep1:
    type: rho
    rcut: 4.0
    sig: 0.3
    nrad: 8
    nang: 6
    neighspe: [H, C]
  rep2:
    type: rho
    rcut: 4.0
    sig: 0.3
    nrad: 8
    nang: 6
    neighspe: [H, C]

# Gaussian process regression variables
gpr:
  z: 2.0
  Menv: 200
  Ntrain: 100
  trainfrac: 1.0
  trainsel: "random"
